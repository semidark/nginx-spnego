# Kerberos client configuration for nginx-spnego auth-gateway
# This file configures the Kerberos realm and KDC for SPNEGO authentication

[libdefaults]
    default_realm = SAMDOM.EXAMPLE.COM
    dns_lookup_realm = false
    dns_lookup_kdc = true
    rdns = false
    forwardable = true
    # Disable weak encryption types
    default_tgs_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    default_tkt_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96
    permitted_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96

[realms]
    SAMDOM.EXAMPLE.COM = {
        kdc = dc01.samdom.example.com
        admin_server = dc01.samdom.example.com
    }

[domain_realm]
    .samdom.example.com = SAMDOM.EXAMPLE.COM
    samdom.example.com = SAMDOM.EXAMPLE.COM

[logging]
    default = STDERR
